# Backing services: PostgreSQL (product data, Database Monitoring target) and
# flagd (feature flags that drive the failure scenarios).
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        tags.datadoghq.com/env: datadog-demo
        tags.datadoghq.com/service: postgresql
        tags.datadoghq.com/version: "18.6"
      annotations:
        # Datadog Autodiscovery: Postgres integration with Database Monitoring.
        # The password is resolved by the Agent's secret backend from the
        # datadog-postgres Secret in the Agent's namespace (created by
        # scripts/deploy.sh); it never appears in this manifest.
        ad.datadoghq.com/postgresql.checks: |
          {
            "postgres": {
              "init_config": {},
              "instances": [
                {
                  "dbm": true,
                  "host": "%%host%%",
                  "port": 5432,
                  "username": "datadog",
                  "password": "ENC[k8s_secret@openshift-operators/datadog-postgres/password]",
                  "dbname": "shop",
                  "collect_schemas": {"enabled": true},
                  "relations": [{"relation_regex": ".*", "schemas": ["catalog"]}],
                  "tags": ["env:datadog-demo", "service:postgresql"]
                }
              ]
            }
          }
        ad.datadoghq.com/postgresql.logs: '[{"source": "postgresql", "service": "postgresql"}]'
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: docker.io/library/postgres:18.6
          args:
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - track_activity_query_size=4096
            - -c
            - track_io_timing=on
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: postgres-password}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: app-password}
            - name: DATADOG_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: datadog-password}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "shop"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        # Demo data is seeded on every start, so an emptyDir is enough.
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  labels:
    app.kubernetes.io/name: flagd
spec:
  selector:
    app.kubernetes.io/name: flagd
  ports:
    - name: grpc
      port: 8013
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  labels:
    app.kubernetes.io/name: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        tags.datadoghq.com/env: datadog-demo
        tags.datadoghq.com/service: flagd
        tags.datadoghq.com/version: v0.16.0
      annotations:
        ad.datadoghq.com/flagd.logs: '[{"source": "go", "service": "flagd"}]'
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.16.0
          # flagd watches this file; edits to the flagd-config ConfigMap take
          # effect within about a minute (see scripts/flag.sh).
          args: ["start", "--uri", "file:/etc/flagd/demo.flagd.json"]
          ports:
            - name: grpc
              containerPort: 8013
          readinessProbe:
            tcpSocket:
              port: 8013
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/flagd
      volumes:
        - name: config
          configMap:
            name: flagd-config
