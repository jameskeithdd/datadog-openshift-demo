# Installs the Red Hat-certified Datadog Operator from OperatorHub into
# openshift-operators (the cluster's default all-namespaces OperatorGroup).
# Equivalent to: Console > Operators > OperatorHub > "Datadog Operator" > Install.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: datadog-operator-certified
  namespace: openshift-operators
spec:
  name: datadog-operator-certified
  channel: stable
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
