# Builds the catalog service image and publishes it to GitHub Container Registry
# as ghcr.io/<owner>/<repo>/catalog:<version>, multi-arch (amd64 + arm64).
name: catalog-image

on:
  push:
    branches: [main]
    paths:
      - src/catalog/**
      - .github/workflows/catalog-image.yaml
  workflow_dispatch:

env:
  # Keep in sync with the catalog image tag in app/kustomization.yaml.
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/catalog" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: src/catalog
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Product catalog service for the Datadog OpenShift demo
            org.opencontainers.image.licenses=Apache-2.0
